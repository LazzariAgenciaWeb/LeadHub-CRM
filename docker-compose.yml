version: '3.8'

services:
  app:
    image: ghcr.io/lazzariagenciaweb/leadhub-crm:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # connection_limit cap o pool por container do Prisma, evita estourar
      # max_connections do Postgres quando o app reinicia em loop. pool_timeout
      # faz queries esperarem por slot livre em vez de abrir mais conexões.
      DATABASE_URL: postgresql://leadhub:leadhub123@db:5432/leadhub?connection_limit=10&pool_timeout=20&connect_timeout=10
      DIRECT_URL: postgresql://leadhub:leadhub123@db:5432/leadhub?connection_limit=10&pool_timeout=20&connect_timeout=10
      NEXTAUTH_URL: https://app.azzagencia.com.br
      NEXTAUTH_SECRET: dK7mP9xQ2rL5nW8vY1tA4uJ6hF3cE0bG
      NEXT_PUBLIC_BASE_URL: https://app.azzagencia.com.br
      NODE_OPTIONS: "--max-old-space-size=400"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=128MB"]
    environment:
      POSTGRES_USER: leadhub
      POSTGRES_PASSWORD: leadhub123
      POSTGRES_DB: leadhub
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
