name: Build & Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builder dedicado do buildx — evita quirks do buildkit padrão
      # (era aqui que dava o "unknown blob" intermitente).
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/lazzariagenciaweb/leadhub-crm:latest
          build-args: |
            NEXT_TELEMETRY_DISABLED=1
          # Imagem single-manifest (sem attestation) — mais simples pro GHCR
          # e pro deploy puxar; corta a origem comum do "unknown blob".
          provenance: false
          # Cache entre builds — mais rápido e estável.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy automático: re-pull + redeploy da stack no Portainer via API.
      # Precisa dos secrets PORTAINER_URL e PORTAINER_TOKEN configurados no
      # repositório. Sem eles, pula silenciosamente (deploy fica manual).
      - name: Deploy no Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
        run: |
          if [ -z "$PORTAINER_TOKEN" ]; then
            echo "Secrets do Portainer não configurados — pulando deploy automático."
            exit 0
          fi
          bash scripts/deploy.sh
